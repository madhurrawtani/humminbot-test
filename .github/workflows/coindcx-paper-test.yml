name: CoinDCX DOGE Futures Paper Test

on:
  workflow_dispatch:

jobs:
  paper-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify bot files
        run: |
          echo "=== BOT FILES ==="
          ls -lah coin-dcx-bot/

          echo "=== CHECK BOT ==="
          python -m py_compile coin-dcx-bot/bot.py

          echo "=== CHECK STRATEGY ==="
          python -m py_compile coin-dcx-bot/strategy.py

      - name: Run 5-minute paper test
        env:
          COINDCX_API_KEY: ${{ secrets.COINDCX_API_KEY }}
          COINDCX_SECRET_KEY: ${{ secrets.COINDCX_SECRET_KEY }}
        run: |
          echo "=========================================="
          echo " COINDCX DOGE FUTURES PAPER TEST"
          echo "=========================================="
          echo "Duration: 300 seconds"
          echo "Capital: ₹1000 virtual"
          echo "Live orders: DISABLED"
          echo ""

          cd coin-dcx-bot

          python bot.py 2>&1 | tee ../coindcx-paper-output.log

      - name: Show results
        if: always()
        run: |
          echo "=========================================="
          echo " TEST OUTPUT"
          echo "=========================================="

          if [ -f coindcx-paper-output.log ]; then
            cat coindcx-paper-output.log
          else
            echo "No output file found."
          fi

      - name: Upload paper test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-doge-paper-results
          path: coindcx-paper-output.log
          if-no-files-found: warn
