name: CoinDCX DOGE Futures Paper Test

on:
  workflow_dispatch:

jobs:
  paper-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout bot
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify bot files
        run: |
          echo "=== BOT FILE ==="
          ls -lh coin-dcx-bot/bot.py

          echo "=== PYTHON SYNTAX CHECK ==="
          python -m py_compile coin-dcx-bot/bot.py

      - name: Run 5-minute paper test
        env:
          COINDCX_API_KEY: ${{ secrets.COINDCX_API_KEY }}
          COINDCX_SECRET_KEY: ${{ secrets.COINDCX_SECRET_KEY }}
        run: |
          echo "=== STARTING COINDCX PAPER TEST ==="
          echo "Duration: 300 seconds"
          echo "Live orders: DISABLED"

          python coin-dcx-bot/bot.py 2>&1 | tee coindcx-paper-output.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-doge-paper-results
          path: coindcx-paper-output.log
          if-no-files-found: warn
