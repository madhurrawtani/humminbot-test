name: Small Edge DOGE Paper Test

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Checkout Hummingbot
        uses: actions/checkout@v4
        with:
          repository: hummingbot/hummingbot
          path: hummingbot

      - name: Install Hummingbot
        working-directory: hummingbot
        run: make install

      - name: Install custom strategy
        run: |
          echo "Installing DOGE strategy..."

          cp scripts/small_edge_pmm.py hummingbot/scripts/small_edge_pmm.py

          echo "=== VERIFY STRATEGY ==="
          ls -lh hummingbot/scripts/small_edge_pmm.py

      - name: Create DOGE strategy config
        working-directory: hummingbot
        run: |
          mkdir -p conf/scripts

          cat > conf/scripts/small_edge_pmm.yml <<'EOF'
          script_file_name: small_edge_pmm.py
          controllers_config: []
          exchange: kraken_paper_trade
          trading_pair: DOGE-USD
          order_amount: 5
          min_edge_bps: 80
          order_refresh_time: 10
          price_type: mid
          EOF

          echo "=== CONFIG ==="
          cat conf/scripts/small_edge_pmm.yml

      - name: Verify strategy import
        working-directory: hummingbot
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate hummingbot

          python -c "import scripts.small_edge_pmm; print('DOGE STRATEGY IMPORT: OK')"

      - name: Start DOGE paper bot
        working-directory: hummingbot
        env:
          HBOT_PASSWORD: ${{ secrets.HBOT_PASSWORD }}
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate hummingbot

          echo "=== STARTING DOGE PAPER BOT ==="

          hbot start small_edge_pmm.yml > bot-output.log 2>&1 &

          BOT_PID=$!

          echo "Bot PID: $BOT_PID"

          echo "=== RUNNING FOR 300 SECONDS ==="

          sleep 300

          echo "=== BOT OUTPUT ==="
          cat bot-output.log || true

          echo "=== BOT STATUS ==="
          hbot status || true

          echo "=== STOPPING BOT ==="
          hbot stop || true

          kill "$BOT_PID" 2>/dev/null || true
          wait "$BOT_PID" 2>/dev/null || true

      - name: Collect results
        if: always()
        working-directory: hummingbot
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate hummingbot

          echo "=== BOT OUTPUT ==="
          cat bot-output.log 2>/dev/null || true

          echo "=== BOT STATUS ==="
          hbot status || true

          echo "=== STRATEGY LOG ==="
          tail -n 500 logs/logs_small_edge_pmm.log 2>/dev/null || true

          echo "=== ALL LOG FILES ==="
          find logs -type f -print 2>/dev/null || true

          echo "=== ALL DATA FILES ==="
          find data -type f -print 2>/dev/null || true

          echo "=== SQLITE DATABASES ==="
          find . -name "*.sqlite" -print 2>/dev/null || true

      - name: Upload paper results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: small-edge-doge-paper-results
          path: |
            hummingbot/bot-output.log
            hummingbot/logs/**
            hummingbot/data/**
            hummingbot/conf/scripts/small_edge_pmm.yml
            hummingbot/*.sqlite
          if-no-files-found: warn
          
