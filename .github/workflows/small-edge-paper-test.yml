name: Small Edge SOL Paper Test

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Checkout Hummingbot
        uses: actions/checkout@v4
        with:
          repository: hummingbot/hummingbot
          path: hummingbot

      - name: Install Hummingbot
        working-directory: hummingbot
        run: make install

      - name: Install custom strategy
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate hummingbot

          mkdir -p hummingbot/conf/scripts

          cp scripts/small_edge_pmm.py hummingbot/conf/scripts/small_edge_pmm.py

          echo "=== CUSTOM STRATEGY ==="
          ls -l hummingbot/conf/scripts/small_edge_pmm.py

      - name: Create V2 config
        working-directory: hummingbot
        env:
          HBOT_PASSWORD: ${{ secrets.HBOT_PASSWORD }}
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate hummingbot

          hbot create --v2-config conf/scripts/small_edge_pmm.py

          echo "=== CONFIG FILES ==="
          find conf -maxdepth 3 -type f -print

      - name: Start Small Edge PMM
        working-directory: hummingbot
        env:
          HBOT_PASSWORD: ${{ secrets.HBOT_PASSWORD }}
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate hummingbot

          echo "Starting Small Edge PMM..."

          hbot start conf/scripts/small_edge_pmm.yml > bot-output.log 2>&1 &
          BOT_PID=$!

          echo "Bot PID: $BOT_PID"

          sleep 3600

          echo "=== BOT OUTPUT ==="
          cat bot-output.log || true

          echo "=== BOT STATUS ==="
          hbot status || true

          echo "=== STOPPING BOT ==="
          hbot stop || true

          kill "$BOT_PID" 2>/dev/null || true
          wait "$BOT_PID" 2>/dev/null || true

      - name: Collect results
        if: always()
        working-directory: hummingbot
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate hummingbot

          echo "=== BOT OUTPUT ==="
          cat bot-output.log 2>/dev/null || true

          echo "=== STATUS ==="
          hbot status || true

          echo "=== LOG FILES ==="
          find logs -type f -print 2>/dev/null || true

          echo "=== DATA FILES ==="
          find data -type f -print 2>/dev/null || true

          echo "=== STRATEGY CONFIG ==="
          cat conf/scripts/small_edge_pmm.yml 2>/dev/null || true

      - name: Upload paper results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: small-edge-paper-results
          path: |
            hummingbot/bot-output.log
            hummingbot/logs/**
            hummingbot/data/**
            hummingbot/conf/scripts/small_edge_pmm.yml
          if-no-files-found: warn
