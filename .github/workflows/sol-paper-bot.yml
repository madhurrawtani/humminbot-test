name: SOL Paper Bot

on:
  workflow_dispatch:

jobs:
  paper-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Hummingbot
        uses: actions/checkout@v4
        with:
          repository: hummingbot/hummingbot
          path: hummingbot

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          
      - name: Install Hummingbot
        working-directory: hummingbot
        run: make install

      - name: Check available commands
        working-directory: hummingbot
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate hummingbot
          hbot --help

      - name: Paper bot placeholder
        run: |
          echo "Hummingbot runtime ready."
          echo "Next step: configure SOL paper strategy."
