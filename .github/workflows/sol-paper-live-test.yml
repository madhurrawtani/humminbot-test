name: SOL Paper Live Test

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Hummingbot
        uses: actions/checkout@v4
        with:
          repository: hummingbot/hummingbot
          path: hummingbot

      - name: Install Hummingbot
        working-directory: hummingbot
        run: make install

      - name: Create SOL paper bot
        working-directory: hummingbot
        env:
          HBOT_PASSWORD: ${{ secrets.HBOT_PASSWORD }}
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate hummingbot

          hbot create simple_pmm \
            --name conf_sol.yml \
            --set exchange=binance_paper_trade \
            --set trading_pair=SOL-USDT

      - name: Start SOL paper bot
        working-directory: hummingbot
        env:
          HBOT_PASSWORD: ${{ secrets.HBOT_PASSWORD }}
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate hummingbot

          echo "Starting SOL paper bot..."

          hbot start conf_sol.yml > bot-output.log 2>&1 &
          BOT_PID=$!

          echo "Bot PID: $BOT_PID"

          sleep 300

          echo "=== BOT OUTPUT ==="
          cat bot-output.log || true

          echo "=== BOT STATUS ==="
          hbot status || true

          echo "=== STOPPING BOT ==="
          hbot stop || true

          kill "$BOT_PID" 2>/dev/null || true
          wait "$BOT_PID" 2>/dev/null || true

      - name: Collect logs and trading data
        if: always()
        working-directory: hummingbot
        run: |
          echo "=== LOG FILES ==="
          find logs -type f -maxdepth 3 -print 2>/dev/null || true

          echo "=== DATA FILES ==="
          find data -type f -maxdepth 3 -print 2>/dev/null || true

          echo "=== BOT OUTPUT ==="
          cat bot-output.log 2>/dev/null || true

      - name: Upload paper trading results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-paper-results
          path: |
            hummingbot/bot-output.log
            hummingbot/logs/**
            hummingbot/data/**
          if-no-files-found: warn
