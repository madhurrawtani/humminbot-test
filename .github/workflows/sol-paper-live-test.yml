name: SOL Paper Live Test

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Hummingbot
        uses: actions/checkout@v4
        with:
          repository: hummingbot/hummingbot
          path: hummingbot

      - name: Install Hummingbot
        working-directory: hummingbot
        run: make install

      - name: Create SOL paper strategy
        working-directory: hummingbot
        env:
          HBOT_PASSWORD: ${{ secrets.HBOT_PASSWORD }}
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate hummingbot

          hbot create simple_pmm \
            --name conf_sol.yml \
            --set exchange=binance_paper_trade \
            --set trading_pair=SOL-USDT

      - name: Start SOL paper bot
        working-directory: hummingbot
        env:
          HBOT_PASSWORD: ${{ secrets.HBOT_PASSWORD }}
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate hummingbot

          echo "Starting V2 SOL paper bot..."

          hbot start --v2 conf_sol.yml &
          BOT_PID=$!

          echo "Bot PID: $BOT_PID"

          sleep 600

          echo "Bot status:"
          hbot status || true

          echo "Stopping bot..."
          hbot stop || true

          wait $BOT_PID || true

      - name: Show trading history
        if: always()
        working-directory: hummingbot
        env:
          HBOT_PASSWORD: ${{ secrets.HBOT_PASSWORD }}
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate hummingbot

          echo "=== HISTORY ==="
          hbot history || true

          echo "=== VERBOSE HISTORY ==="
          hbot history --verbose || true

      - name: Save trading data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-paper-results
          path: |
            hummingbot/logs/**
            hummingbot/data/**
          if-no-files-found: warn
